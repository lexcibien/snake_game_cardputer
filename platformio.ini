; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = snake_game
description = Jogo no cardputer
default_envs = m5stack-cardputer
boards_dir = boards/_jsonfiles
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
platforms_dir = .pio/platforms
packages_dir = .pio/packages

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = espressif32@6.7.0
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  platformio/tool-esptoolpy@2.40900.250804
  espressif/toolchain-xtensa-esp32s3@12.2.0+20230208
board_build.variants_dir = boards
upload_speed = 1500000
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++23
  ; -Wall
  ; -Werror
  -DESP32S3
  -DCORE_DEBUG_LEVEL=5
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Cardputer @ ^1.1.0

# pio run -t compiledb
