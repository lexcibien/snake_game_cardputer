; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = snake_game
description = A basic cardputer snake game
default_envs = m5stack-cardputer
boards_dir = boards/_jsonfiles
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
platforms_dir = .pio/platforms
packages_dir = .pio/packages

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
framework = arduino
board_build.variants_dir = boards
upload_speed = 1500000
extra_scripts =
  scripts/extra_script.py
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++23
  ; -Wall
  ; -Werror
  -DESP32S3
  -DCORE_DEBUG_LEVEL=5
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Cardputer @ ^1.1.0
  bblanchon/ArduinoJson @ ^7.4.2

# pio run -t compiledb
